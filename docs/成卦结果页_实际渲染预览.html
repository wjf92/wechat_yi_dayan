<!DOCTYPE html>

<style>
/* 模拟 WebView 运行时：root font-size 必须压过 app.css 的 html,body{font-size:.28rem}，
   也压过 runtime.js 的 __setUnit() 内联字号，保证手机框内按 750rpx=390px 显示。 */
html{font-size:52px !important}
body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.bar-top{background:#fff;border-bottom:1px solid #d8dce0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar-top h1{font-size:14px;font-weight:600;margin:0 10px 0 0;letter-spacing:1px}
.bar-top .hint{font-size:12px;color:#71767f;margin-right:8px;width:100%;line-height:1.6}
.bar-top button{border:1px solid #d8dce0;background:#fff;color:#71767f;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.bar-top button.on{background:#15171c;border-color:#15171c;color:#fff}
.bar-top button.act{border-color:#e0402f;color:#e0402f}
.bar-sep{width:100%;height:1px;background:#eceef1;margin:4px 0}
.stage{padding:20px;display:flex;justify-content:center}
#phone{width:390px;height:840px;border:10px solid #1c1f24;border-radius:38px;overflow-y:auto;background:#f5f6f8;box-shadow:0 18px 40px rgba(21,23,28,.18);position:relative}
#phone::-webkit-scrollbar{width:6px}#phone::-webkit-scrollbar-thumb{background:#c9ccd1;border-radius:6px}
#app{min-height:100%}
/* WebView 基座：抹平浏览器默认样式，rpx 由 html font-size 提供 */
html, body { margin:0; padding:0; width:100%; height:100%; overflow-x:hidden; }
* { -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none; }
button { appearance:none; -webkit-appearance:none; border:0; border-radius:0;
  background:transparent; color:inherit; font:inherit; line-height:normal;
  padding:0; margin:0; text-align:center; }
canvas { display:block; }
.circl, .ink { touch-action:none; }
#app { min-height:100%; }

}

/* ============ 按钮 ============ */

}

}

.card {

/* ============ 进度条 ============ */
.stepbar {

/* ============ 锁定提示 ============ */
.lock {

}

/* ===== pages/result/result.wxss ===== */
/* pages/result/result.wxss —— 成卦结果页（断占总论三段式） */

.card {
  margin-bottom: 0.22rem;
}

.card-h {
  display: flex;
  align-items: center;
  margin-bottom: 0.16rem;
}

.card-h-t {
  font-size: 0.3rem;

}

.tag {

/* ① 断占总结：一张卡，三行 */
.verdict {

  border: 0.02rem solid #f6d9d3;

}

.verdict-k {

}

.vline {

  align-items: flex-start;
  padding: 0.1rem 0;
  border-bottom: 0.02rem dashed #f0d6d1;
}

.vline.last {
  border-bottom: none;
  padding-bottom: 0.02rem;
}

.vk {
  width: 0.56rem;
  flex: none;

/* ② 本卦：卦象与标记 */
.hex-head {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.1rem;
}

.seal {
  width: 0.72rem;
  height: 0.72rem;
  line-height: 1.15;
  border-radius: 0.14rem;

  color: #ffffff;
  font-size: 0.24rem;
  text-align: center;
  padding: 0.08rem 0.06rem;

  margin-right: 0.18rem;
  box-shadow: 0 0.06rem 0.14rem rgba(224, 64, 47, 0.32);

.hex-name {
  font-size: 0.42rem;
  font-weight: 700;

.trigrams {

.hex {

  margin-top: 0.16rem;
}

/* 六爻严格对齐：行宽固定为 100%，卦象按行中线绝对居中。
   爻题、营数、标记分列左右两端且脱离文档流，不参与居中计算；
   否则标记个数不同会让行宽随内容变化，居中后各爻横画左右漂移。 */
.hex-line {
  position: relative;
  width: 100%;
  height: 0.44rem;
  min-height: 0.44rem;
  margin-bottom: 0.08rem;
  padding: 0 0.08rem;
  border-radius: 0.08rem;
  box-sizing: border-box;
}

.hex-line.yi {
  background: #f7f8fa;
  box-shadow: inset 0.04rem 0 0 #15171c;
}

.hex-label {
  position: absolute;
  left: 0.08rem;
  top: 50%;
  transform: translateY(-50%);
  width: 0.44rem;
  text-align: right;
  font-size: 0.24rem;
  color: #71767f;
  font-family: "Songti SC", "STSong", serif;
}

.hex-bars {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2.4rem;
  height: 0.18rem;
  display: flex;
  justify-content: center;
  align-items: center;
}

.bar {
  width: 2.4rem;
  height: 0.18rem;
  background: #15171c;
  border-radius: 0.04rem;
  flex: none;
}

.bar.half {

}

.bar.changing {

}

.yin {
  width: 2.4rem;
  display: flex;
  justify-content: space-between;
  flex: none;
}

.hex-val {
  position: absolute;
  left: 0.66rem;
  top: 50%;
  transform: translateY(-50%);
  width: 0.9rem;
  font-size: 0.21rem;
  color: #15171c;
}

.marks {
  position: absolute;
  right: 0.08rem;
  top: 50%;
  transform: translateY(-50%);

  align-items: center;
}

.mk {
  font-size: 0.18rem;
  line-height: 0.28rem;
  padding: 0 0.06rem;

}

.mk.change {

}

.mk.yi {
  color: #15171c;
  border: 0.02rem dashed #15171c;

}

.mk.main {

}

.legend {

/* ================= 挂一 · 太极 ================= */
.taiji {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 0.12rem;
  padding: 0.12rem 0.18rem 0.12rem 0.26rem;
  border: 0.02rem solid #15171c;
  border-radius: 0.18rem;
  background: #ffffff;
  box-shadow: 0 0.04rem 0.16rem rgba(21, 23, 28, 0.08);
  overflow: hidden;
}

/* 左侧竖条：强调「这一策自始至终在场」 */
.taiji::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0.06rem;
  background: #15171c;
}

/* 未拈出之前只留一个淡虚位，不预先摆那颗黑球 */
.tj-ring {
  position: relative;
  width: 0.78rem;
  height: 0.78rem;
  flex: 0 0 0.78rem;
  margin-right: 0.18rem;
  border: 0.02rem dashed #dcdfe4;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

/* 太极既立，虚线圈才缓缓呼吸 */
.taiji.on .tj-ring {
  border-color: #15171c;
  animation: tjbreath 3.6s ease-in-out infinite;
}

/* 日轮升定：落定那一瞬自虚位荡开一圈暖光，随后归于常驻的墨色 */
.taiji.on .tj-ring::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  border-radius: 50%;
  border: 0.02rem solid rgba(255, 190, 96, 0.85);
  box-shadow: 0 0 0.22rem 0.08rem rgba(255, 178, 80, 0.42);
  animation: sunLand 700ms ease-out both;
  pointer-events: none;
}
@keyframes sunLand {
  0%   { opacity: 0.9; transform: scale(0.62); }
  100% { opacity: 0;   transform: scale(1.6); }
}

@keyframes tjbreath {
  0%, 100% {
    border-color: rgba(21, 23, 28, 0.28);
    transform: scale(1);
  }
  50% {
    border-color: rgba(21, 23, 28, 0.85);
    transform: scale(1.05);
  }
}

.tj-ball {
  width: 0.46rem;
  height: 0.46rem;
  border-radius: 50%;
  background: #15171c;
  box-shadow: 0 0.04rem 0.12rem rgba(21, 23, 28, 0.45);
  opacity: 0;
  transform: scale(0.94);
  /* 落定不再弹跳：与飞球几乎同尺寸同位置，稳稳涨到实位，接缝看不出来 */
  transition: opacity 0.1s ease, transform 0.2s ease-out;
}

/* 飞球落定的同一瞬显形，尺寸位置与飞球完全一致，接缝看不出来 */
.taiji.on .tj-ball {
  opacity: 1;
  transform: scale(1);
}

.tj-txt {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.tj-t {
  font-size: 0.26rem;
  font-weight: 700;
  letter-spacing: 0.04rem;
  color: #15171c;
  line-height: 1.2;
}

.tj-n {
  margin-top: 0.06rem;
  font-size: 0.17rem;
  color: #8b9099;
  letter-spacing: 0.005rem;
  line-height: 1.3;
}

.tj-tag {
  flex: 0 0 auto;
  margin-left: 0.1rem;
  padding: 0.04rem 0.12rem;
  border-radius: 9.99rem;
  background: #f2f3f5;
  color: #8b9099;
  font-size: 0.16rem;
  letter-spacing: 0.03rem;
  line-height: 1.4;
}

.taiji.on .tj-tag {
  background: #fdeeeb;
  color: #e0402f;
}

/* ================= 席上策数：球堆外左上角 ================= */
.pile-tag {
  position: absolute;
  left: -0.08rem;
  top: -0.1rem;
  z-index: 9;
  display: flex;
  align-items: baseline;
  padding: 0.06rem 0.14rem 0.07rem;
  border: 0.02rem solid #15171c;
  border-radius: 0.12rem;
  background: #ffffff;
  box-shadow: 0 0.04rem 0.12rem rgba(21, 23, 28, 0.10);
  white-space: nowrap;
  pointer-events: none;
}

.pile-cap {
  margin-right: 0.08rem;
  font-size: 0.15rem;
  color: #8b9099;
  letter-spacing: 0.01rem;
}

.pile-n {
  font-size: 0.3rem;
  font-weight: 700;
  line-height: 1;
  color: #15171c;
}

.pile-u {
  margin-left: 0.04rem;
  font-size: 0.16rem;
  color: #71767f;
}

/* ================= 主体 ================= */
.dbody {
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

/* ---------- 圆席 ---------- */
.cwrap {
  position: relative;
  margin-right: 0.06rem;
  flex: 0 0 auto;
}

.circl {
  position: relative;
  border: 0.02rem solid #dcdfe4;
  border-radius: 50%;
  background: #ffffff;
  overflow: hidden;
  box-shadow: inset 0 0.02rem 0.1rem rgba(21, 23, 28, 0.05);
  box-sizing: border-box;
}

/* 球 */
.ball {
  position: absolute;
  border-radius: 50%;
  background: #ffffff;
  border: 0.02rem solid #15171c;
  box-sizing: border-box;
  box-shadow: 0 0.02rem 0.03rem rgba(21, 23, 28, 0.16);
  transition-property: left, top, background-color, box-shadow, opacity, transform;
  transition-timing-function: cubic-bezier(0.22, 0.85, 0.3, 1);
  z-index: 2;
}

.ball.warn {
  border-color: #e0402f;
  background: #fdeeeb;
  box-shadow: 0 0 0 0.06rem rgba(224, 64, 47, 0.18), 0 0.02rem 0.06rem rgba(224, 64, 47, 0.3);
  z-index: 3;
}

/* 球心正好压在分界线上的球：判归属只看球心，用一圈朱红虚环标出来 */
.ball.edge::after {
  content: '';
  position: absolute;
  left: -0.06rem;
  top: -0.06rem;
  right: -0.06rem;
  bottom: -0.06rem;
  border-radius: 50%;
  border: 0.02rem dashed rgba(154, 42, 42, 0.55);
  pointer-events: none;
}

.ball.dark {
  background-color: #15171c;
  border-color: #15171c;
  box-shadow: 0 0.03rem 0.08rem rgba(21, 23, 28, 0.42);
}

/* 拈起为太极的那一策：变黑后微微抬起放大，明确告诉占者取的是哪一颗 */
.ball.dark.pick {
  transform: scale(1.26);
  z-index: 6;
  box-shadow: 0 0.06rem 0.18rem rgba(21, 23, 28, 0.55), 0 0 0 0.05rem rgba(21, 23, 28, 0.14);
}

/* 归奇已离席：原位留一个虚线小圈，标明这几策是从哪儿扐出去的 */
.ball.ghost {
  background-color: transparent;
  border: 0.02rem dashed rgba(21, 23, 28, 0.42);
  box-shadow: none;
  transform: scale(0.62);
  transition-duration: 320ms !important;
}

/* 彻底离席（下一变重铺时才会用到） */
.ball.gone {
  opacity: 0;
  transform: scale(0.45);
  transition-duration: 300ms !important;
}

/* 重新出场的球（洗牌时补回来的） */
.ball.pop {
  animation: ballpop 0.42s ease both;
}

@keyframes ballpop {
  from {
    opacity: 0;
    transform: scale(0.55);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* 画布：你画的线 + 手绘圈 */
.ink {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
}

/* 左 / 右角标：避开左上角那枚「在席 N 策」标签 */
.dtag {
  position: absolute;
  top: 0.58rem;
  z-index: 7;
  padding: 0.04rem 0.14rem;
  border-radius: 9.99rem;
  background: #ffffff;
  border: 0.02rem solid #dcdfe4;
  font-size: 0.16rem;
  color: #71767f;
  letter-spacing: 0.01rem;
  opacity: 0;
  transition: opacity 0.2s;
}

.dtag.on {
  opacity: 1;
}

.dtag-l {
  left: 0.12rem;
}

.dtag-r {
  right: 0.12rem;
}

.dtag-b {
  color: #15171c;
  font-weight: 700;
}

/* ---------- 成爻 ---------- */
.yao-calc {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: fadeup 0.42s ease both;
}

@keyframes fadeup {
  from {
    opacity: 0;
    transform: translateY(0.1rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.yc-cap {
  font-size: 0.18rem;
  color: #71767f;
  letter-spacing: 0.06rem;
}

.yc-eq {
  font-size: 0.22rem;
  color: #71767f;
  margin-top: 0.06rem;
}

.yc-num {
  font-size: 1.32rem;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 0.04rem;
}

.yao-line {
  width: 0.96rem;
  height: 0.14rem;
  margin-top: 0.1rem;
}

.yao-line.yang {
  background: #15171c;
  border-radius: 0.02rem;
}

.yao-line.yin {
  display: flex;
  justify-content: space-between;
}

.yao-line.yin::before,
.yao-line.yin::after {
  content: "";
  width: 0.38rem;
  height: 0.14rem;
  background: #15171c;
  border-radius: 0.02rem;
}

/* ---------- 三变柱：黑球自上而下计归奇，三段留空当 ---------- */
.pillars {
  width: 1.12rem;
  flex: 0 0 1.12rem;
  display: flex;
  align-self: center;
  padding-top: 0;
}

.pil {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-right: 0.04rem;
  min-width: 0;
}

.pil:last-child {
  margin-right: 0;
}

.pil-lab {
  font-size: 0.15rem;
  color: #b6bac1;
  white-space: nowrap;
  letter-spacing: 0;
}

.pil-num {
  font-size: 0.26rem;
  font-weight: 700;
  line-height: 1;
  margin-top: 0.06rem;
}

.pil-dots {
  width: 100%;
  height: 2rem;
  margin-top: 0.08rem;
  padding: 0.1rem 0;
  border: 0.02rem solid #eceef1;
  border-radius: 0.12rem;
  background: #fafbfc;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow: hidden;
}

/* 归奇落定：实心黑球（自上而下：挂 1 ｜ 右余 ｜ 左余） */
.bdot {
  width: 0.12rem;
  height: 0.12rem;
  margin-top: 0.04rem;
  border-radius: 50%;
  box-sizing: border-box;
  background: #15171c;
  border: none;
  flex: 0 0 0.12rem;
}

/* 尚未归奇：极淡的空位 */
.bdot.g {
  background: #e3e6ea;
}

/* 段与段之间留空当：挂 1 ｜ 右余 ｜ 左余 */
.bdot.gap {
  margin-top: 0.12rem;
}


/* ================= 下方步骤轨 ================= */
.steps {
  display: flex;
  align-items: center;
  margin: 0 0.04rem;
}

.stp {
  width: 0.44rem;
  height: 0.44rem;
  flex: 0 0 0.44rem;
  border-radius: 50%;
  border: 0.02rem solid #dcdfe4;
  background: #ffffff;
  color: #c3c7cd;
  font-size: 0.18rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}

.stp.done {
  border-color: #15171c;
  color: #15171c;
}

.stp.cur {
  background: #15171c;
  border-color: #15171c;
  color: #ffffff;
  transform: scale(1.08);
  box-shadow: 0 0.06rem 0.16rem rgba(21, 23, 28, 0.3);
}

.stp-line {
  flex: 1;
  height: 0.02rem;
  margin: 0 0.04rem;
  background: #eceef1;
}

.stp-line.done {
  background: #15171c;
}

.stpname {
  margin-top: 0.2rem;
  margin-bottom: 0.12rem;
  text-align: center;
  font-size: 0.28rem;
  font-weight: 600;
  color: #15171c;
  letter-spacing: 0.03rem;
}

/* ================= 底部 ================= */
.dbot {
  margin-top: 0.18rem;
}

.dhint {
  display: block;
  margin-top: 0.14rem;
  text-align: center;
  font-size: 0.2rem;
  color: #71767f;
  line-height: 1.7;
  white-space: pre-line;
}

/* 计数 chip */
.chips {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 0.14rem;
}

.chip {
  padding: 0.04rem 0.18rem;
  margin: 0 0.05rem;
  border: 0.02rem solid #dcdfe4;
  border-radius: 9.99rem;
  background: #ffffff;
  font-size: 0.2rem;
  color: #15171c;
}

.chip.dark-chip {
  background: #15171c;
  border-color: #15171c;
  color: #ffffff;
}

.chip.sum {
  background: #e0402f;
  border-color: #e0402f;
  color: #ffffff;
  font-weight: 600;
}

/* 算式：不再做黑底卡片，与 .dhint 同一套说明文字排版 */
.formula {
  margin-top: 0.1rem;
  padding: 0;
  background: transparent;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.f-cap {
  font-size: 0.18rem;
  color: #9aa0aa;
  letter-spacing: 0.04rem;
  line-height: 1.7;
}

.f-eq {
  margin-top: 0.02rem;
  font-size: 0.2rem;
  color: #71767f;
  white-space: nowrap;
  letter-spacing: 0.005rem;
  line-height: 1.7;
}

.f-note {
  margin-top: 0.02rem;
  font-size: 0.18rem;
  color: #9aa0aa;
  letter-spacing: 0.005rem;
  line-height: 1.7;
}

/* 按钮：紧跟步骤轨，.dbot 的 0.18rem 上边距即与步骤条的间距 */
.btn {
  margin-top: 0;
  width: 100%;
  padding: 0.22rem 0;
  border-radius: 0.2rem;
  background: #e0402f;
  color: #ffffff;
  font-size: 0.28rem;
  letter-spacing: 0.08rem;
  font-weight: 600;
  height: auto;
  line-height: 1.2;
  box-shadow: 0 0.08rem 0.24rem rgba(224, 64, 47, 0.26);
}

.btn::after {
  border: none;
}

.btn.wait {
  background: #f0f1f3;
  color: #a8adb5;
  box-shadow: none;
}

.lock {
  margin-top: 0.16rem;
  padding: 0.12rem;
  border: 0.02rem dashed #e0402f;
  border-radius: 0.14rem;
  background: #fdeeeb;
  font-size: 0.19rem;
  color: #e0402f;
  text-align: center;
  line-height: 1.6;
}

.relink {
  margin-top: 0.16rem;
  text-align: center;
  font-size: 0.2rem;
  color: #71767f;
  text-decoration: underline;
}

/* ================= 飞球 ================= */
.flyball {
  position: fixed;
  z-index: 99;
  border-radius: 50%;
  background: #15171c;
  border: 0.02rem solid transparent;
  box-sizing: border-box;
  box-shadow: 0 0.03rem 0.1rem rgba(21, 23, 28, 0.45);
  transition-property: transform, background-color, border-color, box-shadow;
  transition-timing-function: cubic-bezier(0.45, 0.05, 0.25, 1);
  pointer-events: none;
}

/* 落定：收成柱内那颗实心小黑球 */
.flyball.land {
  background-color: #15171c;
  border: none;
  box-shadow: none;
}

/* ================= 挂一 · 如日之初升 =================
   位移由 JS 分四拍喂给 transition（慢起缓停），光感则全交给这里的
   keyframes 独立承担：即使某次 setData 在真机上被合并、位移没播出来，
   「由暗转明 → 日晕铺开 → 光华收回」的完整过程依然看得见，不会像闪现。 */
.flyball.sun {
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.34, 0.02, 0.22, 1);
  animation: sunBody 1600ms ease-in-out both;
}

/* 本体：墨色日轮由内敛到镀上暖金边，升定后光华收回 */
@keyframes sunBody {
  0% {
    border-color: rgba(255, 198, 104, 0);
    box-shadow: 0 0.03rem 0.1rem rgba(21, 23, 28, 0.45);
  }
  16% {
    border-color: rgba(255, 198, 104, 0.92);
    box-shadow: 0 0 0.16rem 0.04rem rgba(255, 182, 84, 0.62),
                0 0 0.34rem 0.12rem rgba(232, 126, 46, 0.30);
  }
  62% {
    border-color: rgba(255, 210, 130, 0.78);
    box-shadow: 0 0 0.22rem 0.07rem rgba(255, 182, 84, 0.55),
                0 0 0.48rem 0.18rem rgba(232, 126, 46, 0.24);
  }
  100% {
    border-color: rgba(255, 198, 104, 0);
    box-shadow: 0 0.03rem 0.1rem rgba(21, 23, 28, 0.45);
  }
}

/* 日晕：朱金暖光自球心向外铺开，再随升空缓缓淡去 */
.flyball.sun::before {
  content: "";
  position: absolute;
  left: -80%;
  top: -80%;
  width: 260%;
  height: 260%;
  border-radius: 50%;
  background: radial-gradient(circle,
              rgba(255, 214, 138, 0.62) 0%,
              rgba(255, 176, 76, 0.34) 28%,
              rgba(224, 64, 47, 0.16) 48%,
              rgba(224, 64, 47, 0) 70%);
  opacity: 0;
  transform: scale(0.5);
  animation: sunGlow 1600ms ease-out both;
  pointer-events: none;
}
@keyframes sunGlow {
  0%   { opacity: 0;    transform: scale(0.5); }
  20%  { opacity: 0.95; transform: scale(1.0); }
  64%  { opacity: 0.78; transform: scale(1.32); }
  100% { opacity: 0;    transform: scale(1.62); }
}

/* 日冕环：一圈细金环自轮缘荡开，像旭日的光波 */
.flyball.sun::after {
  content: "";
  position: absolute;
  left: -0.04rem;
  right: -0.04rem;
  top: -0.04rem;
  bottom: -0.04rem;
  border-radius: 50%;
  border: 0.02rem solid rgba(255, 196, 100, 0.9);
  opacity: 0;
  animation: sunRim 1200ms ease-out both;
  pointer-events: none;
}
@keyframes sunRim {
  0%   { opacity: 0;    transform: scale(0.9); }
  18%  { opacity: 0.85; transform: scale(1.0); }
  55%  { opacity: 0.35; transform: scale(1.9); }
  78%  { opacity: 0.6;  transform: scale(1.0); }
  100% { opacity: 0;    transform: scale(2.3); }
}

/* ===== pages/index/index.wxss ===== */

  display: flex;
  flex-direction: column;

.hero-title {
  font-size: 0.62rem;
  font-weight: 700;

__def('utils/store.js', function(module, exports, require){
// utils/store.js —— 占例本地存储
// KEY 一旦发布就不要改：小程序端为 wx storage，Android 端由 runtime 映射到
// app 私有文件 + WebView localStorage。改 KEY 会让旧版本占例读不出来。
const KEY = 'dayan_sessions_v1';
const MAX = 100;

// 向后兼容：旧版本记录没有 question 等字段时补默认值，且保留记录上的其它
// 字段原样（未来版本新增字段也不会被这里抹掉）。
function normalize(item) {
  if (!item || typeof item !== 'object') return null;
  const r = Object.assign({}, item);
  r.id = r.id || ('s' + (r.createdAt || Date.now()));
  r.createdAt = r.createdAt || Date.now();
  if (!Array.isArray(r.values)) r.values = [];
  if (!Array.isArray(r.changeLabels)) r.changeLabels = [];
  if (typeof r.question !== 'string') r.question = '';
  else r.question = r.question.trim();
  return r;
}

function list() {
  try {
    const all = wx.getStorageSync(KEY);
    if (!Array.isArray(all)) return [];
    return all.map(normalize).filter(function (x) { return !!x; });
  } catch (e) {
    return [];
  }
}

function save(session) {
  const all = list();
  const record = normalize(Object.assign({}, session, {
    id: session.id || ('s' + Date.now() + Math.floor(Math.random() * 10000)),
    createdAt: session.createdAt || Date.now()
  }));
  const rest = all.filter(function (item) { return item.id !== record.id; });
  rest.unshift(record);
  try {
    wx.setStorageSync(KEY, rest.slice(0, MAX));
  } catch (e) {
    return { data: null, error: 'CLIENT_EXCEPTION' };
  }
  return { data: record, error: null };
}

function get(id) {
  const all = list();
  for (let i = 0; i < all.length; i++) {
    if (all[i].id === id) return all[i];
  }
  return null;
}

function remove(id) {
  const rest = list().filter(function (item) { return item.id !== id; });
  try {
    wx.setStorageSync(KEY, rest);
  } catch (e) {
    return { data: null, error: 'CLIENT_EXCEPTION' };
  }
  return { data: true, error: null };
}

// 只改所占事项，不动卦象数据（供后续版本扩展）
function setQuestion(id, question) {
  const all = list();
  let hit = false;
  const next = all.map(function (item) {
    if (item.id !== id) return item;
    hit = true;
    return Object.assign({}, item, { question: String(question || '').trim() });
  });
  if (!hit) return { data: null, error: 'NOT_FOUND' };
  try {
    wx.setStorageSync(KEY, next);
    return { data: true, error: null };
  } catch (e) {
    return { data: null, error: 'CLIENT_EXCEPTION' };
  }
}

function formatTime(ts) {
  const d = new Date(ts || Date.now());
  const pad = function (n) { return n < 10 ? ('0' + n) : ('' + n); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
    ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

module.exports = {
  list: list,
  save: save,
  get: get,
  remove: remove,
  setQuestion: setQuestion,
  formatTime: formatTime
};

  stepIndex: function (k, b) {
    for (let i = 0; i < this.steps.length; i++) {
      const s = this.steps[i];
      if (s.k === k && (b == null || s.b === b)) return i;
    }
    return 0;
  },

  clearInk: function () {
    this.loopList = [];
    this.loopAl = [];
    this.loopSt = [];
    this.loopVisible = false;
    this.strokeSt = null;
    this.strokeAl = 0;
    this.stroke = [];
    this.extSeg = [];
    this.paint();
  },

  /* =========================================================
     外壳：步骤轨 / 记录带 / 三变柱
     ========================================================= */
  chrome: function (n) {
    const steps = this.steps;
    const st = steps[n];

    const rails = steps.map(function (s, i) {
      return {
        i: i,
        n: i + 1,
        lab: s.lab,
        cls: i < n ? 'done' : (i === n ? 'cur' : ''),
        line: i < steps.length - 1,
        lineCls: i < n ? 'done' : ''
      };
    });

    const pillars = [];
    for (let b = 0; b < 3; b++) {
      const info = this.pillarInfo[b];
      const done = !!info;
      const cnt = done ? (1 + info.r1 + info.r2) : 0;
      /* 自上而下：挂 1 ｜ 右余 ｜ 左余 */
      const dots = [];
      for (let j = 0; j < cnt; j++) {
        dots.push({ i: j, gap: j === 1 || j === 1 + info.r1 });
      }
      pillars.push({
        lab: BIAN[b],
        val: done ? cnt : '—',
        c: done ? '#15171c' : '#c3c7cd',
        done: done,
        dots: dots
      });
    }

    let meta = YAO[this.yaoIndex] + '爻 · ';
    if (st.k === 'hang') meta += '起筮';
    else if (st.k === 'yao') meta += '三变已毕';
    else meta += '第 ' + (st.b + 1) + ' 变 · 第 ' + (n + 1) + '/' + steps.length + ' 步';

    this.setData({
      step: n,
      stepKey: st.k,
      rails: rails,
      yaoDots: this.buildRecord(this.yaoIndex),
      pillars: pillars,
      metaText: meta,
      stepName: st.full
    });
  },

  buildRecord: function (hi) {
    const out = [];
    for (let i = 0; i < 6; i++) {
      const v = this.values[i];
      const on = (i === hi);
      if (!v) {
        out.push({ k: YAO[i], v: '▢', cls: on ? 'cur' : '', bian: false });
      } else {
        const info = dayan.yaoInfo(v);
        out.push({
          k: YAO[i],
          v: CN[v] + ' ' + info.symbol,
          cls: on ? 'has cur' : 'has',
          bian: !!info.changing
        });
      }
    }
    return out;
  },

  /* =========================================================
     球池
     ========================================================= */
  /* 球径按「覆盖率恒定」换算：49 策与 28 策看着一样密，不会越洗越稀 */
  ballFor: function (n) {
    const target = this.dia * Math.sqrt(0.155 / Math.max(1, n));
    const lo = 24 * this.rpx;
    const hi = 44 * this.rpx;
    return Math.max(2, Math.round(Math.min(hi, Math.max(lo, target))));
  },

  makeSpots: function (n) {
    let raw = [];
    for (let t = 0; t < 3; t++) {
      raw = dayan.layoutEven(n, this.dia, this.sz, this.gap);
      if (raw.length >= n) break;
      raw = dayan.layoutInCircle(n, this.dia, this.sz, this.gap, 0);
      if (raw.length >= n) break;
    }
    return raw.slice(0, n).map(function (p) {
      return { x: p.x + this.sz / 2, y: p.y + this.sz / 2 };
    }, this);
  },

  renderBalls: function () {
    const sz = this.sz;
    const balls = this.balls.map(function (b) {
      return {
        id: b.id,
        x: Math.round(b.cx - sz / 2),
        y: Math.round(b.cy - sz / 2),
        cls: b.cls || '',
        d: b.d || 0,
        dl: b.dl || 0,
        ad: b.ad || 0
      };
    });
    /* 席上现存策数：ghost（原位虚线小圈）与 gone（已彻底离席）都不算球 */
    let pile = 0;
    this.balls.forEach(function (b) {
      const c = b.cls || '';
      if (c.indexOf('ghost') < 0 && c.indexOf('gone') < 0) pile++;
    });
    this.setData({ balls: balls, ballSize: sz, dia: this.dia, pileCount: pile });
  },

  /* 重新铺球：留到几颗就摆几颗，其余淡出 */
  relayout: function (count, animate) {
    this.sz = this.ballFor(count);
    this.gap = Math.round(this.sz * 0.4);
    const pts = this.makeSpots(count);
    /* 已归奇离席的球不再参与，免得下一变又「复活」 */
    const live = this.balls.filter(function (b) { return b.cls !== 'gone' && b.cls !== 'ghost'; });
    const keep = live.slice(0, Math.min(live.length, count));
    const next = [];
    for (let i = 0; i < count; i++) {
      const old = keep[i];
      if (old) {
        next.push({
          id: old.id, cx: pts[i].x, cy: pts[i].y, cls: '',
          d: animate ? 520 : 0, dl: animate ? i * 7 : 0
        });
      } else {
        next.push({
          /* 非动画重铺（开局）不带入场动画：否则后续任何列表重排都会让整席球
             把「从无到有」的淡入重播一遍，看起来就是闪无又闪现 */
          id: 'b' + (this.seq++), cx: pts[i].x, cy: pts[i].y,
          cls: animate ? 'pop' : '',
          d: 0, dl: 0, ad: animate ? 300 + i * 6 : 0
        });
      }
    }
    this.balls = next;
    this.pts = pts;
    this.renderBalls();
  },

  /* =========================================================
     S1 挂一（五十取一 · 太极）
     ========================================================= */
  enterHang: function () {
    /* 全局仅此一次（首爻起筮）：五十策列席、太极位是虚位，等用户点「下一步」拈出。
       掐断尚未触发的延时回调并递增爻代次，使任何已排队的旧回调自动失效。 */
    (this.timers || []).forEach(function (id) { clearTimeout(id); });
    this.timers = [];
    if (this.inkTimer) { clearInterval(this.inkTimer); this.inkTimer = null; }
    this.epoch = (this.epoch || 0) + 1;

    this.steps = buildSteps(true);       // 仅首爻八步（含「起筮 · 挂一」）
    this.stroke = [];
    this.sides = [];
    this.hang = -1;
    this.changes = [];
    this.totals = [49, 0, 0];
    this.nextTotal = 0;
    this.pillarInfo = [null, null, null];
    this.clearInk();
    this.balls = [];
    this.relayout(50, false);              // 大衍之数五十：太极那一策此刻还在席上

    this.setData({
      total: 50,
      taijiOn: false,                     // 太极位是虚位，点「下一步」才由席上飞入
      leftCount: 0,
      rightCount: 0,
      splitDone: false,
      chips: [],
      formulaText: '',
      formulaNote: '',
      fly: [],
      btnWait: false,
      hint: '大衍之数五十，其用四十有九 —— 五十策尽列于席\n点「下一步」：拈出一策，如日初升，缓缓升入上方太极位；此后十八变此策常驻不动、不再回席',
      btnText: '下 一 步 · 拈 出 太 极'
    });
    this.chrome(0);

    /* 幂等兜底：起筮铺 50 策时，若原生渲染器把两次 setData 合并在同一帧，
       wx:for 的 key 复用可能停在空列表；下一帧再核一次，席上不是 50 策就补铺。
       正常流程下这里什么也不做，不会引起重绘或闪烁。 */
    const self = this;
    const gen = this.epoch;
    this.later(function () {
      if ((self.epoch || 0) !== gen) return;
      if (self.balls.length !== 50 || (self.data.balls || []).length !== 50) {
        self.relayout(50, false);
      }
    }, 30);
  },

  /* S1 的动作：拈起变黑（看得出是哪一策）→ 如日初升，缓缓升入太极位 → 余 49 策
     「日出」分四拍：变黑凝住 → 光晕初萌、微微浮起（露头）→ 缓升归位 → 落定光环。
     每一拍都是一次独立的 setData，彼此间隔 ≥300ms；不靠「两次 setData 的差值」
     来撑 transition 起点（真机上那两帧常被合并，看起来就是直接闪现）。
     位移之外的光感由 WXSS keyframes 独立承担，即使某段位移被合并，
     也仍有完整的由暗转明、光晕铺开的过程可见。
     落定之后绝不再重绘球堆，避免整席球「闪无又闪现」。 */
  takeTaiji: function () {
    if (this.hangAnimating) return;
    const self = this;
    /* 挂一总时长 2000ms：改这一组即可整体调速，四段相加须与 WXSS 里
       sunBody / sunGlow 的 animation 时长（1600ms）对得上。 */
    const BLACK_MS = 420;      // 拈起变黑、抬起，凝住让人看清取的是哪一策
    const LIFT_MS = 160;       // 飞球接手：先以 d:0 硬渲染起始帧，日晕开始萌动
    const HOVER_MS = 260;      // 如日之初升：先垂直浮起 16px，光晕铺开
    const FLY_MS = 1000;       // 缓缓升空，慢起缓停，飞入上方太极位
    const SETTLE_MS = 160;     // 落定，光环扩散，实球显形
    const HOVER_PX = 16;       // 「跃出地平线」的那一下上浮
    const PICK_SC = 1.26;      // 与 .ball.dark.pick 的放大一致，飞球接手时不缩一下
    if (!this.balls.length) {             // 极端兜底：没球就直接推进
      this.taiji = true;
      this.setData({ taijiOn: true, fly: [] });
      this.enterSplit(0);
      return;
    }

    /* 拈最上一枚：从球堆上沿起飞，飞向左上方太极位，路径最顺 */
    let pick = 0, bestY = 1e9;
    for (let i = 0; i < this.pts.length; i++) {
      if (this.pts[i].y < bestY) { bestY = this.pts[i].y; pick = i; }
    }
    const p = this.pts[pick];
    const sz = this.sz;
    this.hangAnimating = true;

    this.setData({
      btnWait: true,
      btnText: '如 日 初 升 …',
      hint: '自五十策中拈出一策，如日之初升，虚一不用 —— 此策为太极\n此后十八变常驻不动、不再回席，余四十九策以备分二'
    });

    /* 1. 拈起：这一枚变黑、微微抬起放大，停一会儿，让人看清取的是哪一颗 */
    this.balls[pick].cls = 'dark pick';
    this.balls[pick].d = 260;
    this.renderBalls();

    /* 2. 离席起飞：起飞前重测一次位置（页面滚过也不跑偏） */
    this.later(function () {
      self.measure(function () {
        const r = self.circleRect, tr = self.taijiRect;
        self.balls.splice(pick, 1);
        self.pts.splice(pick, 1);
        self.renderBalls();                       // 在席之策 50 → 49，其余球一颗不动

        const done = function () {
          self.taiji = true;
          self.hangAnimating = false;
          self.setData({ taijiOn: true, fly: [] });
          self.enterSplit(0);                    // 此处不再碰球堆
        };
        if (!r || !tr) { done(); return; }       // 量不到位置就退化为直接落位

        const x0 = Math.round(r.left + p.x - sz / 2);
        const y0 = Math.round(r.top + p.y - sz / 2);
        const tx = Math.round(tr.left + tr.width / 2 - x0 - sz / 2);
        const ty = Math.round(tr.top + tr.height / 2 - y0 - sz / 2);
        const sc = Math.round((46 * self.rpx / sz) * 100) / 100;   // 落到 46rpx 的太极球

        /* 2. 飞球接手：先在原位以 d:0 硬渲染一帧（同位置、同大小、同色、同缩放），
           并挂上 .sun，由 keyframes 独立把日晕从暗养到明。
           这一帧不带任何位移过渡，即使后续 setData 被合并也不会「瞬移」。 */
        self.setData({
          fly: [{ id: 'taiji', sun: true, x: x0, y: y0, size: sz,
                  d: 0, dl: 0, land: false, tx: 0, ty: 0, sc: PICK_SC }]
        });
        /* 3. 露头：先垂直微微浮起，像日轮挣出地平线，光晕铺开 */
        self.later(function () {
          self.setData({
            fly: [{ id: 'taiji', sun: true, x: x0, y: y0, size: sz,
                    d: HOVER_MS, dl: 0, land: false, tx: 0, ty: -HOVER_PX,
                    sc: Math.round(PICK_SC * 1.04 * 100) / 100 }]
          });
        }, LIFT_MS);
        /* 4. 升空：慢起缓停，斜斜升入上方太极位 */
        self.later(function () {
          self.setData({
            fly: [{ id: 'taiji', sun: true, x: x0, y: y0, size: sz,
                    d: FLY_MS, dl: 0, land: false, tx: tx, ty: ty, sc: sc }]
          });
        }, LIFT_MS + HOVER_MS);
        /* 5. 落定：飞球隐去、太极位实球显形，同尺寸同位置，看不出接缝 */
        self.later(done, LIFT_MS + HOVER_MS + FLY_MS + SETTLE_MS);
      });
    }, BLACK_MS);
  },

  /* =========================================================
     S2/S4/S6 分二挂一
     ========================================================= */
  enterSplit: function (b) {
    const total = b === 0 ? 49 : this.changes[b - 1].next;
    this.totals[b] = total;

    this.sides = [];
    this.hang = -1;
    /* b>0：圈与划线正随洗牌一起淡出，别在这里一刀清掉；淡完由 inkTick 收尾 */
    if (b === 0) {
      this.stroke = [];
      this.clearInk();
    } else {
      this.strokeSt = this.strokeSt || { from: (this.strokeAl == null ? 1 : this.strokeAl), to: 0, t0: Date.now(), dur: 520 };
      this.startInk();
    }
    if (b > 0) {
      /* 揲四既毕，余策球「洗牌重分」：错峰散到新的落点 */
      this.relayout(total, true);
    } else if (this.balls.length !== total) {
      /* 每爻首变只在席上策数不对时补铺：首爻挂一动画已把 50 裁成 49；
         二～上爻成爻清席后是 0，这里直接补铺 49（太极之策不再回席）。
         避免正常流程重铺导致整席「闪无又闪现」，也不留空席。 */
      this.relayout(total, false);
    }

    this.setData({
      total: total,
      leftCount: 0,
      rightCount: 0,
      splitDone: false,
      chips: [],
      formulaText: '',
      formulaNote: '',
      btnWait: true,
      hint: '在球间从上往下画一条线，分成左右两堆\n线须自最上一排的上方起、画到最下一排的下方（上下画反也行），中路不要回折\n画成什么线就留什么线，球一颗都不动；松手后程序自右堆取一挂起',
      btnText: '请 先 划 线 分 堆'
    });
    this.chrome(this.stepIndex('split', b));
  },

  /* 圆席在屏幕上的位置（飞球用） */
  measure: function (cb) {
    const self = this;
    const q = wx.createSelectorQuery().in(this);
    q.select('#ballField').boundingClientRect();
    q.selectAll('.pil-dots').boundingClientRect();
    q.select('.tj-ball').boundingClientRect();       // 太极位的落点（未拈出时也在，只是缩着）
    q.exec(function (res) {
      self.circleRect = res[0] || null;
      self.pillarRects = res[1] || [];
      self.taijiRect = res[2] || null;
      if (cb) cb();
    });
  },

  guard: function (e, type) {
    const t = (e && e.touches && e.touches[0]) || null;
    const px = t && t.clientX != null ? t.clientX : (t && t.pageX != null ? t.pageX : NaN);
    const py = t && t.clientY != null ? t.clientY : (t && t.pageY != null ? t.pageY : NaN);
    const key = type + '|' + ((e && e.timeStamp) || 0) + '|' + px + ',' + py;
    if (this._lastKey === key) return true;
    this._lastKey = key;
    return false;
  },

  onTouchStart: function (e) {
    if (this.data.stepKey !== 'split' || this.data.splitDone) return;
    if (this.guard(e, 'start')) return;
    const t = e.touches[0];
    this.rawStroke = [{ x: t.clientX, y: t.clientY }];
    /* 新的一笔：把上一变残留的圈、线、淡出动画一并清掉，免得抢画笔 */
    this.stroke = [];
    this.strokeAl = 1;
    this.strokeSt = null;
    this.loopList = [];
    this.loopAl = [];
    this.loopSt = [];
    this.loopVisible = false;
    if (this.inkTimer) { clearInterval(this.inkTimer); this.inkTimer = null; }
    this.paint();
    this.clearWarn();
    this.measure();
  },

  /* 标红「归左归右说不清」的那几颗球，1.4 秒后自行褪回 */
  warnBalls: function (idx) {
    if (!idx || !idx.length) return;
    const self = this;
    this.balls.forEach(function (b, i) {
      if (idx.indexOf(i) >= 0) { b.cls = 'warn'; b.d = 160; }
    });
    this.renderBalls();
    this.warnOn = true;
    this.later(function () {
      if (!self.warnOn) return;
      self.clearWarn();
    }, 1400);
  },

  clearWarn: function () {
    if (!this.warnOn) return;
    this.warnOn = false;
    this.balls.forEach(function (b) { if (b.cls === 'warn') b.cls = ''; });
    this.renderBalls();
  },

  onTouchMove: function (e) {
    if (this.data.stepKey !== 'split' || this.data.splitDone) return;
    if (this.guard(e, 'move')) return;
    const t = e.touches[0];
    const prev = this.rawStroke[this.rawStroke.length - 1];
    if (!prev) return;
    const dx = t.clientX - prev.x, dy = t.clientY - prev.y;
    if (Math.sqrt(dx * dx + dy * dy) < 6) return;
    this.rawStroke.push({ x: t.clientX, y: t.clientY });

    const r = this.circleRect;
    if (!r) return;
    this.stroke = this.rawStroke.map(function (p) {
      return { x: p.x - r.left, y: p.y - r.top };
    });
    this.strokeAl = 1;      // 上一变的圈线可能刚淡过，这里必须重新点亮
    this.strokeSt = null;
    this.paint();
  },

  onTouchEnd: function (e) {
    if (this.data.stepKey !== 'split' || this.data.splitDone) return;
    if (this.guard(e, 'end')) return;
    if (!this.rawStroke || this.rawStroke.length < 2) return;

    if (!this.circleRect) {
      const self = this;
      this.measure(function () { self.finishSplit(); });
      return;
    }
    this.finishSplit();
  },

  finishSplit: function () {
    const self = this;
    const r = this.circleRect;
    let samples = this.rawStroke.map(function (p) {
      return { x: p.x - r.left, y: p.y - r.top };
    });

    const boxes = this.pts.map(function (p) {
      return { x: p.x - self.sz / 2, y: p.y - self.sz / 2 };
    });

    /* 先验笔势：方向明确、不回折、不横画。不再要求「线必须盖过上下两排球心」——
       两端会沿切线延长到席外，延长线照样把圆席切开（见 dayan.extendSplit） */
    const chk = dayan.checkSplit(boxes, samples, this.sz, this.dia, this.dia);
    if (!chk.ok) {
      if (chk.code === 'short') {
        this.setData({ hint: '这一笔太短了，看不出分界\n请从球阵一侧划到另一侧，笔势要成一个方向' });
      } else if (chk.code === 'flat') {
        this.setData({ hint: '这一笔太横了\n分堆是按「每个高度上的分界点」判的，横线没有高下之分\n请上下走向地划：从球阵上方划到下方（或反过来）都行，斜着也可以' });
      } else {
        this.setData({ hint: '这一笔画回来了\n回折处同一高度会出现左右两个分界，球归哪边说不清\n请一笔画到底，不要往回折' });
      }
      wx.showToast({ title: '请重新划线', icon: 'none' });
      return;
    }

    const res = dayan.splitByCurve(boxes, samples, this.sz, this.dia, this.dia);
    if (!res || res.fallback || res.left < 1 || res.right < 2) {
      wx.showToast({ title: '左右各留二策以上（挂一须从右堆取），请重画', icon: 'none' });
      return;
    }

    const total = this.data.total;
    const ch = dayan.change(total, res.left);
    if (ch.error || ch.next < 12) {
      wx.showToast({ title: '分堆无效，请重新划线', icon: 'none' });
      return;
    }

    /* 挂一：右堆最上一枚变黑挂起 */
    let pick = -1, bestY = 1e9;
    for (let i = 0; i < this.pts.length; i++) {
      if (res.sides[i] === 2 && this.pts[i].y < bestY) { bestY = this.pts[i].y; pick = i; }
    }
    if (pick < 0) {
      wx.showToast({ title: '右堆为空，请重新划线', icon: 'none' });
      return;
    }

    /* 球心正好压在线上的那几颗：判归属只看球心，但要标出来让占者看见 */
    const edgeList = res.edge || [];
    const edgeN = edgeList.length;
    const edgeSet = {};
    edgeList.forEach(function (i) { edgeSet[i] = 1; });

    this.sides = res.sides.map(function (s) { return s === 1 ? 'L' : 'R'; });
    this.hang = pick;
    this.stroke = samples;
    this.extSeg = res.ext || [];        // 两端延长到席外的那两段，画成细虚线
    this.strokeAl = 1;
    this.strokeSt = null;
    this.paint();

    this.balls.forEach(function (b, i) {
      b.cls = (i === pick) ? 'dark' : '';
      if (edgeSet[i]) b.cls += (b.cls ? ' ' : '') + 'edge';
      b.d = 0;
      b.dl = 0;
    });
    this.renderBalls();

    const b = this.steps[this.data.step].b;
    const divTip = (ch.r1 === 4 || ch.r2 === 4) ? ' · 整除者以四为余' : '';
    const edgeTip = edgeN
      ? '\n有 ' + edgeN + ' 颗球正压在这条线上（朱红虚环）· 归属只看球心：心在线左即左，在线右即右'
      : '';
    const extN = (res.ext || []).length;
    const extTip = extN
      ? '\n两端细虚线是把这一笔延长到席外的部分 —— 球按延长后的分界归边'
      : '';
    this.setData({
      leftCount: res.left,
      rightCount: res.right - 1,
      splitDone: true,
      btnWait: false,
      chips: [
        { t: '左 ' + res.left },
        { t: '右 ' + (res.right - 1) },
        { t: '挂 1', dark: true },
        { t: '合 ' + total, sum: true }
      ],
      hint: '此线由你亲手所画，原样保留；球一颗未动' + extTip
        + '\n右堆最上一枚已变黑挂起（第 ' + (b + 1) + ' 变，共 ' + total + ' 策）' + divTip + edgeTip,
      btnText: '下 一 步（揲四归奇）'
    });
  },

  onRedraw: function () {
    if (this.data.stepKey !== 'split') return;
    this.rawStroke = [];
    this.stroke = [];
    this.extSeg = [];
    this.sides = [];
    this.hang = -1;
    this.paint();
    this.balls.forEach(function (b) { b.cls = ''; b.d = 0; b.dl = 0; });
    this.renderBalls();
    this.setData({
      leftCount: 0,
      rightCount: 0,
      splitDone: false,
      chips: [],
      btnWait: true,
      hint: '在球间从上往下画一条线，分成左右两堆\n线须自最上一排的上方起、画到最下一排的下方（上下画反也行），中路不要回折\n画成什么线就留什么线，球一颗都不动；松手后程序自右堆取一挂起',
      btnText: '请 先 划 线 分 堆'
    });
  },

  /* =========================================================
     S3/S5/S7 揲四归奇：不换页、球不动，四策一圈，余策归柱
     ========================================================= */
  enterCount: function (b) {
    const ch = dayan.change(this.totals[b], this.data.leftCount);
    this.changes[b] = ch;
    this.nextTotal = ch.next;

    this.setData({
      btnWait: true,
      btnText: '揲 四 中 …',
      chips: [],
      hint: '球一颗不动：四策一圈（圈不相交、不越线），余策变黑归奇\n'
        + (ch.r1 === 4 || ch.r2 === 4 ? '此变有整除者，整四策以四为余、照常取出\n' : '')
        + '归奇 ' + (1 + ch.r1 + ch.r2) + ' 策扐入「' + BIAN[b] + '」柱（自上而下：挂 1 ｜ 右余 ｜ 左余）'
    });

    /* 1. 就地画圈 */
    this.showLoops();

    /* 2. 定出离席的余策（含整除记四那四策），与圈里那一撮完全一致。
       柱内自上而下是「挂 1 ｜ 右余 ｜ 左余」，自下而上码放即：左余 → 右余 → 挂 1 */
    const remL = [];
    const remR = [];
    const groups = loops.groupBalls(this.sides, this.pts, this.hang, this.sz);
    groups.forEach(function (g) {
      if (!g.rem) return;
      const box = (g.side === 'L') ? remL : remR;
      g.idx.forEach(function (i) { box.push(i); });
    });
    const went = remL.concat(remR).concat([this.hang]);

    const self = this;
    const n = went.length;

    /* 3. 余策变黑 */
    this.later(function () {
      self.balls.forEach(function (bl, i) {
        if (went.indexOf(i) >= 0) { bl.cls = 'dark'; bl.d = 180; }
      });
      self.renderBalls();
    }, 240);

    /* 4. 逐颗飞入对应柱段；起飞前重测一次位置，页面滚过也不会跑偏。
       黑球被「拎起」的那一瞬，原位立刻收成虚线小圈，画面上不留实球残影 */
    const takeoff = 600;
    const flight = 420;
    const stagger = 32;
    this.later(function () {
      self.measure(function () {
        self.balls.forEach(function (bl, i) {
          if (went.indexOf(i) >= 0) { bl.cls = 'ghost'; bl.d = 220; }
        });
        self.renderBalls();
        self.flyTo(b, went, self.pillarTarget(b, n, ch.r1, ch.r2));
      });
    }, takeoff);

    const landed = takeoff + flight + stagger * Math.max(0, n - 1);

    /* 5. 落定：黑球就地缩成柱内小黑点（自上而下第几格，就落在第几格） */
    this.later(function () { self.settleFly(); }, landed + 40);

    /* 6. 柱内计数亮起，按钮解禁。此时手绘圈与划线都还在，点「下一步」洗牌时才散 */
    const arrive = landed + 40 + 220;
    this.later(function () {
      self.pillarInfo[b] = { r1: ch.r1, r2: ch.r2 };
      self.chrome(self.stepIndex('count', b));
      self.setData({
        fly: [],
        btnWait: false,
        btnText: b < 2 ? '下 一 步（第 ' + (b + 2) + ' 变）' : '下 一 步（成爻）',
        hint: '归奇 ' + (1 + ch.r1 + ch.r2) + ' 策已入「' + BIAN[b] + '」柱 · 余 ' + ch.next + ' 策'
          + (b < 2 ? '，洗牌后作第 ' + (b + 2) + ' 变入策' : '以待成爻')
      });
    }, arrive);

    /* 7. 算式条 */
    const divTip = (ch.r1 === 4 || ch.r2 === 4) ? ' · 整除者以四为余' : '';
    this.setData({
      formulaText: ch.total + ' － 1(挂) － ' + ch.r1 + '(右余) － ' + ch.r2 + '(左余) ＝ ' + ch.next,
      formulaNote: '本变归奇 ' + (1 + ch.r1 + ch.r2) + ' 策（挂 1 ｜ 右余 ' + ch.r1 + ' ｜ 左余 ' + ch.r2 + '）' + divTip
    });
    this.chrome(this.stepIndex('count', b));
  },

  /* 柱落点（视口坐标）：柱内自上而下「挂 1 ｜ 右余 ｜ 左余」，
     第一格圆心即 .pil-dots 的 padding-top 10rpx + .bdot margin 4rpx + 半个球 6rpx = 20rpx */
  pillarTarget: function (b, count, r1, r2) {
    const rects = this.pillarRects || [];
    const r = rects[b];
    if (!r) return null;
    return {
      x: r.left + r.width / 2,
      y: r.top + Math.round(22 * this.rpx),         // 第 0 格（挂 1）圆心 = 边框 2 + 内边距 10 + 上间距 4 + 半颗 6
      pitch: Math.round(16 * this.rpx),             // 12rpx 球 + 4rpx 间距
      extra: Math.round(8 * this.rpx),              // .gap 多出来的 8rpx
      r1: r1 || 0,
      r2: r2 || 0
    };
  },

  /* 第 slot 格在柱内相对第 0 格下沉多少 */
  slotDrop: function (slot, target) {
    return slot * target.pitch
      + (slot >= 1 ? target.extra : 0)
      + (slot >= 1 + target.r1 ? target.extra : 0);
  },

  flyTo: function (b, went, target) {
    if (!target || !this.circleRect) return;
    const cr = this.circleRect;
    const sz = this.sz;
    const r1 = target.r1, r2 = target.r2;
    const fly = [];
    let n = 0;
    for (let k = 0; k < went.length; k++) {
      const i = went[k];
      const p = this.pts[i];
      if (!p) continue;
      /* went 自下而上码：前 r2 颗是左余，接着 r1 颗是右余，最后一颗是挂 1 */
      let slot;
      if (k >= r1 + r2) slot = 0;
      else if (k >= r2) slot = 1 + (k - r2);
      else slot = 1 + r1 + k;
      fly.push({
        id: 'f' + b + '_' + i,
        x: Math.round(cr.left + p.x - sz / 2),
        y: Math.round(cr.top + p.y - sz / 2),
        size: sz,
        tx: 0,
        ty: 0,
        sc: 1,
        d: 420,
        dl: n * 32,
        ty2: Math.round(target.y - (cr.top + p.y) + this.slotDrop(slot, target))
      });
      n++;
    }
    this.setData({ fly: fly });
    const self = this;
    this.later(function () {
      self.setData({
        fly: fly.map(function (f) {
          return {
            id: f.id, x: f.x, y: f.y, size: f.size, d: f.d, dl: f.dl, sc: 1,
            tx: Math.round(target.x - f.x - f.size / 2),
            ty: f.ty2
          };
        })
      });
    }, 30);
  },

  /* 落定：黑球就地缩成柱内那颗实心小黑点，无缝衔接 */
  settleFly: function () {
    const fly = this.data.fly || [];
    if (!fly.length) return;
    const dot = 12 * this.rpx;
    const sc = Math.max(0.28, Math.min(1, dot / this.sz));
    this.setData({
      fly: fly.map(function (f) {
        return {
          id: f.id, x: f.x, y: f.y, size: f.size, tx: f.tx, ty: f.ty,
          sc: Math.round(sc * 100) / 100, d: 200, dl: 0, land: true
        };
      })
    });
  },

  /* =========================================================
     S8 成爻
     ========================================================= */
  enterYao: function () {
    const remain = this.changes[2].next;
    const value = dayan.yaoValue(remain);
    if (!value) {
      wx.showToast({ title: '演算异常，请重新起卦', icon: 'none' });
      return;
    }
    if (this.values.length === this.yaoIndex) this.values.push(value);
    const info = dayan.yaoInfo(value);

    this.clearInk();
    this.balls = [];
    this.renderBalls();

    this.setData({
      yaoRemain: remain,
      yaoNum: CN[value],
      yaoName: info.name,
      yaoYang: info.yang,
      fly: [],
      btnWait: false,
      hint: info.name + ' · ' + (info.changing ? '可变之爻，爻旁记「变」' : '不变之爻')
        + '\n' + remain + ' ÷ 4 ＝ ' + value + '，已记入六爻带的「' + YAO[this.yaoIndex] + '」位',
      btnText: this.yaoIndex === 5 ? '查 看 卦 象' : '演 下 一 爻'
    });
    this.chrome(this.steps.length - 1);
  },

  /* 二～上爻开场：太极之策自首爻拈出后永久离席、十八变常驻不动，
     因此不再重演「起筮 · 挂一」——七步轨、席上直接重铺 49 策，
     第一步就是「1变 · 分二挂一」。成爻页已清空球堆，这里负责补回。 */
  enterNextYao: function () {
    /* 与 enterHang 同样的跨爻防线：掐断上一爻遗留的归奇/洗牌/标红回调 */
    (this.timers || []).forEach(function (id) { clearTimeout(id); });
    this.timers = [];
    if (this.inkTimer) { clearInterval(this.inkTimer); this.inkTimer = null; }
    this.epoch = (this.epoch || 0) + 1;

    this.steps = buildSteps(false);      // 七步：无「起筮 · 挂一」
    this.changes = [];
    this.totals = [49, 0, 0];
    this.nextTotal = 0;
    this.pillarInfo = [null, null, null];
    this.clearInk();
    this.balls = [];
    this.renderBalls();

    this.setData({
      taijiOn: true,                    // 太极之策不回虚位、不重播日出动画
      fly: [],
      btnWait: false
    });
    this.enterSplit(0);                 // 补铺 49 策、七步轨、按钮与提示

    this.setData({
      hint: '太极之策已定，十八变不再回席 —— 本爻自 49 策起，直接分二\n'
        + '在球间从上往下画一条线，分成左右两堆；松手后程序自右堆取一挂起'
    });

    /* 幂等兜底：同一帧里「成爻清空 → 新爻铺满」两次 setData 被合并时，
       wx:for 可能停在空列表；下一帧核一次，非 49 策就补铺。 */
    const self = this;
    const gen = this.epoch;
    this.later(function () {
      if ((self.epoch || 0) !== gen) return;
      if (self.balls.length !== 49 || (self.data.balls || []).length !== 49) {
        self.relayout(49, false);
      }
    }, 30);
  },

  /* =========================================================
     推进
     ========================================================= */
  onNext: function () {
    const st = this.steps[this.data.step];

    if (st.k === 'hang') {
      this.takeTaiji();                    // 太极既立在动画收尾处置 true
      return;
    }

    if (st.k === 'split') {
      if (!this.data.splitDone) {
        wx.showToast({ title: '请先在球堆上画线分堆', icon: 'none' });
        return;
      }
      if (this.data.btnWait) return;
      this.enterCount(st.b);
      return;
    }

    if (st.k === 'count') {
      if (this.data.btnWait) return;
      if (this.changes[st.b].next < 12) {
        wx.showToast({ title: '演算异常，请重新起卦', icon: 'none' });
        return;
      }
      /* 圈与划线留着不动，等下一变洗牌时才散（520ms 与球的位移同步） */
      this.fadeLoops(520);
      if (st.b < 2) this.enterSplit(st.b + 1);
      else this.enterYao();
      return;
    }

    /* 成爻之后 */
    if (this.yaoIndex >= 5) {
      const session = dayan.buildSession(this.values);
      session.id = 's' + Date.now() + Math.floor(Math.random() * 1000);
      session.createdAt = Date.now();
      getApp().globalData.pendingSession = session;
      wx.redirectTo({ url: '/pages/result/result' });
      return;
    }
    /* 太极之策自首爻拈出后永久离席：二～上爻不再重演「起筮 · 挂一」，
       太极位保持实球，席上直接重铺 49 策、七步轨从「1变 · 分二挂一」起。 */
    this.yaoIndex += 1;
    this.hangAnimating = false;
    this.enterNextYao();
  }
});
